# Trechos para o server { } de approutinetech.com.br (443). NÃO aplicado ainda.
# Antes: sudo cp /etc/nginx/sites-available/<arquivo> ~/nginx-antes-rastreio.conf
# Depois: sudo nginx -t && sudo systemctl reload nginx
# Para desfazer: apagar estes blocos (ou voltar a cópia) e recarregar.

# 1) Serviço de rastreio (rastreio_vps.py em 127.0.0.1:8790)
location /r/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    access_log off;
}

# 2) Injeta o script nas páginas já publicadas, sem mexer nos arquivos.
#    Herda o root do server; a página continua igual se /r/ cair (o script falha calado).
#    Se já existir "location /modelos/" ou "/clientes/" no server, junte as 3 linhas sub_filter nele.
location /modelos/ {
    sub_filter '</body>' '<script src="/r/r.js" defer></script></body>';
    sub_filter_once on;
    sub_filter_types text/html;
    try_files $uri $uri/ =404;
}
location /clientes/studio-arte/ {
    sub_filter '</body>' '<script src="/r/r.js" defer></script></body>';
    sub_filter_once on;
    sub_filter_types text/html;
    try_files $uri $uri/ =404;
}

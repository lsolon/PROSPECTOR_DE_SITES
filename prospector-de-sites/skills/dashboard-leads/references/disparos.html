<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prospector — Disparos</title>
<style>
:root{
 --paper:#F0EEE5;--surface:#FAF9F5;--white:#FFFFFF;--ink:#1F1E1D;--muted:#7A766E;--line:#E3DFD5;
 --side:#1F1E1D;--side-ink:#CFC9BE;--side-line:#3A3835;
 --accent:#D97757;--accent-2:#B5532F;--accent-soft:#F4E5DE;
 --ok:#4E8757;--ok-soft:#E7EFE8;--warn:#A86E14;--warn-soft:#F6ECD9;--danger:#A8483B;--danger-soft:#F5E1DD;
 --f-sites:#5E9DA8;--f-ing:#9C7BB8;--f-dec:#C98A2D;
 --serif:Georgia,'Times New Roman',serif;--sans:-apple-system,'Segoe UI',Roboto,Inter,Arial,sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --paper:#1B1A18;--surface:#232220;--white:#2A2926;--ink:#ECE8E0;--muted:#A39E94;--line:#3A3834;
 --side:#121110;--side-ink:#BDB7AC;--side-line:#2C2A27;
 --accent-soft:#3A2A23;--ok:#7DB486;--ok-soft:#24302A;--warn:#D9A24A;--warn-soft:#352C1D;--danger:#D97A6C;--danger-soft:#3A2522;--accent-2:#E89474;
}}
:root[data-theme="dark"]{
 --paper:#1B1A18;--surface:#232220;--white:#2A2926;--ink:#ECE8E0;--muted:#A39E94;--line:#3A3834;
 --side:#121110;--side-ink:#BDB7AC;--side-line:#2C2A27;
 --accent-soft:#3A2A23;--ok:#7DB486;--ok-soft:#24302A;--warn:#D9A24A;--warn-soft:#352C1D;--danger:#D97A6C;--danger-soft:#3A2522;--accent-2:#E89474;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;display:flex}
button,textarea,select,input{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* lateral igual ao painel */
aside{width:232px;flex:0 0 232px;background:var(--side);color:#EDEAE3;padding:22px 14px;display:flex;flex-direction:column;height:100%;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 20px;border-bottom:1px solid var(--side-line);margin-bottom:16px}
.logo .burst{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.logo b{font-family:var(--serif);font-size:17px;font-weight:600}
.logo span{display:block;font-size:11px;color:#A8A399;margin-top:1px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;justify-content:space-between;background:none;border:0;color:var(--side-ink);font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:9px;text-align:left;cursor:pointer}
nav button:disabled{opacity:.45;cursor:default}
nav button.on{background:var(--accent);color:#fff}
nav button .qt{font-size:11px;background:#00000030;padding:1px 8px;border-radius:10px}
.side-foot{margin-top:auto;font-size:11.5px;color:#8B867C;padding:12px 10px;line-height:1.55}

main{flex:1;min-width:0;height:100%;overflow-y:auto;padding:22px 28px 40px}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.45;margin-bottom:18px}
.aviso b{font-weight:700}
.topbar{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font-family:var(--serif);font-size:28px;font-weight:600;margin:0}
.topbar .upd{color:var(--muted);font-size:12.5px;margin-top:4px}
.busca{margin-left:auto;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:9px 14px;width:260px;max-width:100%}

/* filas: os contadores são as abas */
.filas{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.fila{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px 13px;text-align:left;cursor:pointer;position:relative}
.fila .n{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1}
.fila .l{font-size:12.5px;font-weight:700;margin-top:6px}
.fila .d{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.fila.on{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.fila.urg .n{color:var(--warn)}
.fila.ok .n{color:var(--ok)}
.fila.quente .n{color:var(--accent-2)}
.pill.abriu{background:var(--ok-soft);color:var(--ok)}
.card.novo{box-shadow:0 0 0 2px var(--ok)}

.filtros{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-bottom:16px}
.grupo{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grupo>span{font-size:12px;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--white);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}

/* cartões */
.lista{display:flex;flex-direction:column;gap:12px}
.card{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--fc,var(--accent));border-radius:12px;display:grid;grid-template-columns:minmax(220px,300px) 1fr;overflow:hidden}
.info{padding:15px 16px;border-right:1px solid var(--line);background:var(--surface)}
.nm{font-weight:700;font-size:14.5px;line-height:1.3}
.mt{color:var(--muted);font-size:12.5px;margin-top:3px}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;background:var(--paper);white-space:nowrap}
.pill.fr{color:#fff;background:var(--fc)}
.pill.venc{background:var(--warn-soft);color:var(--warn)}
.gancho{font-size:12.5px;color:var(--muted);font-style:italic;border-left:2px solid var(--line);padding-left:8px;line-height:1.45;margin:8px 0}
.conv{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.conv li{padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.45;white-space:pre-wrap;max-width:92%}
.conv li.eu{background:var(--paper);border:1px solid var(--line);align-self:flex-end}
.conv li.cliente{background:#e8f0e6;align-self:flex-start}
.conv li small{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.chips-resp{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.chips-resp button{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer}
.chips-resp button:hover{border-color:var(--accent);color:var(--accent)}
.apres{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.apres summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent)}
.apres textarea{margin-top:8px}
.hist{list-style:none;margin:10px 0 0;padding:0;font-size:12px;color:var(--muted)}
.hist li{padding:3px 0 3px 14px;position:relative;line-height:1.4}
.hist li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--line)}
.hist li.feito::before{background:var(--ok)}
.hist li.prox::before{background:var(--warn)}
.msg{padding:15px 16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.msg label{font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:10px}
.msg textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface);line-height:1.5;font-size:13.5px}
.msg textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.enviada{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;white-space:pre-wrap;line-height:1.5;max-height:110px;overflow:auto}
.acoes{display:flex;flex-wrap:wrap;gap:7px}
.btn{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.quiet{background:none;border-color:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--danger)}
details.banco{font-size:12px;color:var(--muted)}
details.banco summary{cursor:pointer;font-weight:600}
details.banco pre{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:11.5px;line-height:1.45;margin:8px 0 0;color:var(--ink)}
.vazio{background:var(--white);border:1px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;color:var(--muted)}
.vazio b{display:block;color:var(--ink);font-family:var(--serif);font-size:17px;margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--paper);padding:11px 14px 11px 16px;border-radius:10px;font-size:13px;display:flex;gap:14px;align-items:center;max-width:min(560px,calc(100vw - 32px));transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:0}
.rodape{margin-top:26px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* rastreio e métricas */
.rast{font-size:12px;margin-top:8px;padding:7px 9px;border-radius:8px;background:var(--paper);line-height:1.45}
.rast b{font-weight:700}
.rast.aberto{background:var(--ok-soft);color:var(--ok)}
.rast.nao{background:var(--warn-soft);color:var(--warn)}
.rast button{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:11.5px}
.rast ul{margin:6px 0 0;padding-left:16px;color:var(--ink)}
.rast ul li.bot{color:var(--muted);text-decoration:line-through}
.vista{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--white)}
.vista button{border:0;background:none;padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--muted)}
.vista button.on{background:var(--ink);color:var(--paper)}
.met h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:26px 0 4px}
.met .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px;line-height:1.45}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile .n{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1}
.tile .l{font-size:12.5px;font-weight:700;margin-top:6px}
.tile .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.tab{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
.tab th,.tab td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tab th:first-child,.tab td:first-child{text-align:left}
.tab th{font-size:11.5px;color:var(--muted);font-weight:700;background:var(--surface)}
.tab tr:last-child td{border-bottom:0}
.rolar{overflow-x:auto;-webkit-overflow-scrolling:touch}
.calor{display:grid;grid-template-columns:42px repeat(24,minmax(22px,1fr));gap:2px;min-width:640px;font-size:10.5px}
.calor .h,.calor .dl{color:var(--muted);display:flex;align-items:center;justify-content:center}
.calor .dl{justify-content:flex-start;font-weight:700}
.calor .c{height:28px;border-radius:4px;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:default}
.calor .c.v{color:#fff;font-weight:700}
.calor .c:hover{outline:2px solid var(--ink)}
.leg{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.leg i{display:inline-block;width:22px;height:12px;border-radius:3px}
.dica{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:7px 10px;border-radius:8px;line-height:1.4;z-index:30;display:none;max-width:240px}
.fup{display:flex;flex-direction:column;gap:8px}
.fup .item{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fup .item b{font-size:13.5px}
.fup .item span{color:var(--muted);font-size:12.5px}
.fup .item .btn{margin-left:auto}
@media (max-width:1100px){.filas{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){
 body{display:block}
 aside{display:none}
 main{height:auto;overflow:visible;padding:16px 14px 40px}
 .card{grid-template-columns:1fr}
 .info{border-right:0;border-bottom:1px solid var(--line)}
 .busca{margin-left:0;width:100%}
 .filas{grid-template-columns:repeat(2,minmax(0,1fr))}
 .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<aside>
 <div class="logo"><div class="burst">✳</div><div><b>Prospector</b><span>App Routine Tech</span></div></div>
 <nav>
  <button onclick="location.href='/dashboard.html'">Painel</button>
  <button class="on">Disparos <span class="qt" id="qtNav">0</span></button>
 </nav>
 <div class="side-foot" id="sideFoot">Os disparos de todos os chats e do Claude Code, lidos do prospector.db.</div>
</aside>

<main>
 <div class="aviso" id="avisos" hidden></div>

 <div class="topbar">
  <div>
   <h1>Disparos</h1>
   <div class="upd">Todas as frentes num lugar só · hoje é <span id="hoje"></span></div>
  </div>
  <input class="busca" id="busca" type="search" placeholder="Buscar por nome, cidade ou texto" aria-label="Buscar">
  <div class="vista" role="tablist" aria-label="Vista"><button class="on" data-vista="cards" role="tab">Cards</button><button data-vista="metricas" role="tab">Métricas</button></div>
  <button class="btn" id="atualizar">Atualizar e importar entrada</button>
 </div>
 <div id="vCards">

 <div class="filas" id="filas" role="tablist" aria-label="Filas"></div>
 <div class="filtros">
  <div class="grupo" id="fFrente"></div>
  <div class="grupo" id="fCanal"></div>
 </div>
 <div class="lista" id="lista"><div class="vazio"><b>Carregando…</b></div></div>
 </div>
 <div class="met" id="vMetricas" hidden></div>
</main>
<div class="dica" id="dica" role="tooltip"></div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTxt"></span><button id="toastUndo">Desfazer</button></div>

<script>
const FRENTES = {
 ingressos:{nome:'Ingressos', cor:'var(--f-ing)'},
 decoracao:{nome:'Decoração de festas', cor:'var(--f-dec)'},
 sites:{nome:'Sites', cor:'var(--f-sites)'}
};
const CANAIS = {whatsapp:'WhatsApp', instagram:'Instagram', email:'E-mail', messenger:'Messenger'};
const FILAS = [
 {id:'enviar', nome:'A enviar', desc:'mensagem pronta, ainda não saiu'},
 {id:'followup', nome:'Follow-up hoje', desc:'enviado há 4+ dias, sem resposta', cls:'urg'},
 {id:'abriram', nome:'Abriram', desc:'viram o link, sem resposta ainda', cls:'quente'},
 {id:'aguardando', nome:'Aguardando', desc:'enviado, dentro do prazo'},
 {id:'responderam', nome:'Responderam', desc:'conversa em andamento', cls:'ok'},
 {id:'encerrados', nome:'Encerrados', desc:'recusa ou sem resposta'}
];
let HOJE = new Date().toISOString().slice(0,10);
/* Modelos de resposta (depois que o cliente responde), por frente. [escola] vira o nome do lead. */
const RESPOSTAS = {
 ingressos: {
  'Quer ver': 'Que bom! Preparei uma apresentação rápida: dá para passar as telas, do site até o PIX, ou assistir ao vídeo de 1 minuto da compra sendo feita.\n\nhttps://approutinetech.com.br/clientes/studio-arte/apresentacao/\n\nSe preferir, faço uma chamada de vídeo rapidinha (uns 15 minutos) e mostro tudo ao vivo. Qual dia e horário ficam bons?\n\nE para eu já preparar a conversa: em qual teatro vocês costumam se apresentar, quantos lugares ele tem e quando é o espetáculo deste ano?',
  'Perguntou preço': 'Depende do tamanho do evento: lugares do teatro (ou lotação do espaço), número de alunos e quantos espetáculos por ano. Para eu te passar um valor certo, podemos fazer uma chamada rápida de uns 15 minutos? Aproveito e mostro o sistema funcionando. Qual dia e horário ficam bons?',
  'Já tem plataforma': 'Obrigado pelo retorno! Faz todo sentido seguir com o que já está combinado para este ano. Fico à disposição para o próximo espetáculo. Se quiserem um site da [escola] com a página do espetáculo, ele funciona junto com a plataforma que vocês já usam. Sucesso!',
  'Não é o momento': 'Imagina, obrigado pelo retorno! Faz todo sentido. Sucesso no espetáculo! Se um dia precisarem de algo, é só chamar. Um abraço!'
 },
 _padrao: {
  'Quer ver': 'Que bom! Vou te mostrar como ficaria para a [escola]. Posso te ligar ou fazer uma chamada rápida de uns 15 minutos? Qual dia e horário ficam bons?',
  'Perguntou preço': 'Depende do que vocês precisam (quantas páginas, se tem agendamento, catálogo etc.). Para eu te passar um valor certo, podemos conversar uns 15 minutos? Qual dia e horário ficam bons?',
  'Não é o momento': 'Imagina, obrigado pelo retorno! Faz todo sentido. Se um dia precisarem, é só chamar. Um abraço!'
 }
};
function modelosDe(d){ return RESPOSTAS[d.frente] || RESPOSTAS._padrao; }
function preencher(t, d){ return t.replace(/\[escola\]/g, d.lead_nome || 'vocês'); }
function conversaDe(d){ try{ return JSON.parse(d.conversa || '[]'); }catch(e){ return []; } }
function pedidoClaude(d){
 const conv = conversaDe(d).map(m => (m.quem==='cliente' ? 'Cliente' : 'Eu') + ' (' + br(m.em) + '): ' + m.texto).join('\n\n');
 return 'Me ajude a responder um lead da prospecção. Escreva só a minha próxima mensagem, curta, para ' + (CANAIS[d.canal]||d.canal) + ', no meu tom (Solon, da App Routine Tech), sem preço por mensagem e sem prometer o que o sistema não faz' + (d.frente==='ingressos' ? ' (siga a skill sistema-ingressos-prospeccao)' : '') + '.\n\n'
  + 'Lead: ' + (d.lead_nome||d.slug) + (d.lead_cidade ? ' · ' + d.lead_cidade : '') + '\nFrente: ' + nomeFrente(d.frente) + (d.lead_motivo ? '\nContexto: ' + d.lead_motivo : '') + '\n\n'
  + 'Minha primeira mensagem (' + br(d.enviadoEm||d.criadoEm) + '):\n' + d.mensagem + (conv ? '\n\nConversa depois disso:\n' + conv : '') + '\n\n'
  + 'Rascunho que eu já tenho (pode ignorar ou melhorar):\n' + (d.respostaMsg || '(nenhum)');
}
/* Segunda mensagem opcional (depois do primeiro contato), por frente. Edite os textos e links aqui. */
const APRESENTACAO = {
 ingressos: 'Para vocês verem com calma, preparei uma apresentação rápida do sistema, com um vídeo de 1 minuto mostrando a compra:\nhttps://approutinetech.com.br/clientes/studio-arte/apresentacao/\n\nSe fizer sentido, marcamos uma conversa rápida para eu entender o espetáculo de vocês.',
 decoracao: 'Para você ver com calma, este é o exemplo de site que montei para decoração de festas:\nhttps://approutinetech.com.br/modelos/decoracao-festas/\n\nSe fizer sentido, preparo um com as fotos e os temas de vocês.'
};
function apresPadrao(d){
 if(APRESENTACAO[d.frente]) return marcarLinks(APRESENTACAO[d.frente], d.codigo_rastreio);
 if(d.lead_urlNova) return marcarLinks('Para você ver com calma, esta é a prévia que preparei para vocês:\n' + d.lead_urlNova + '\n\nSe fizer sentido, conversamos sobre os ajustes.', d.codigo_rastreio);
 return '';
}
/* Rastreio: ?l=<codigo> nos links de /modelos/ e /clientes/ (mesma regra do rastreio_modulo.py) */
function marcarLinks(t, cod){
 if(!t || !cod) return t;
 return t.replace(/https?:\/\/(?:www\.)?approutinetech\.com\.br\/(?:modelos|clientes)\/[^\s<>"')\]]*/gi, u=>{
  const p = (u.match(/[.,;:!?]+$/)||[''])[0]; u = u.slice(0, u.length-p.length);
  return /[?&]l=/.test(u) ? u+p : u + (u.includes('?')?'&':'?') + 'l=' + cod + p;
 });
}
const hm = s => s ? s.slice(8,10)+'/'+s.slice(5,7)+(s.length>10?' '+s.slice(11,16):'') : '';
function dur(min){
 if(min==null) return '—';
 if(min < 1) return 'menos de 1 min';
 if(min < 60) return Math.round(min)+' min';
 if(min < 48*60){ const h=Math.floor(min/60), m=Math.round(min%60); return h+'h'+(m?String(m).padStart(2,'0'):''); }
 return (min/1440).toFixed(1).replace('.',',')+' dias';
}
const agoraLocal = () => new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,19).replace('T',' ');
const entre = (a,b) => (a && b) ? (new Date(b.replace(' ','T')) - new Date(a.replace(' ','T')))/6e4 : null;
function blocoRastreio(d){
 if(!d.codigo_rastreio) return d.enviadoEm ? '<div class="rast">Link sem rastreio (enviado antes do código).</div>' : '';
 if(!d.enviado_em) return `<div class="rast">Link rastreável · código <b>${esc(d.codigo_rastreio)}</b>. Clique em “Enviei” logo depois de enviar: a hora separa a pré-visualização do WhatsApp da abertura de verdade.</div>`;
 const resp = d.respondeu_em ? ` · respondeu em <b>${dur(entre(d.enviado_em,d.respondeu_em))}</b>` : '';
 const ver = `<button data-acao="verAcessos" data-id="${d.id}">ver acessos</button><div id="ac${d.id}"></div>`;
 if(d.primeira_abertura_em) return `<div class="rast aberto">Abriu em <b>${dur(entre(d.enviado_em,d.primeira_abertura_em))}</b> (${hm(d.primeira_abertura_em)}) · ${d.total_aberturas} abertura${d.total_aberturas==1?'':'s'}${resp} · ${ver}</div>`;
 const h = entre(d.enviado_em, agoraLocal())/60;
 return `<div class="rast ${h>=72?'nao':''}">Ainda não abriu · enviado ${hm(d.enviado_em)}${h>=72?' (há '+Math.floor(h/24)+' dias)':''}${resp} · ${ver}</div>`;
}

const br = d => d ? d.slice(8,10)+'/'+d.slice(5,7) : '';
const dias = (a,b) => Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/864e5);

async function api(url, opt={}){
 const r = await fetch(url, {headers:{'Content-Type':'application/json'}, ...opt});
 const j = await r.json().catch(()=>({erro:'resposta inválida'}));
 if(!r.ok) throw new Error(j.erro || ('erro '+r.status));
 return j;
}

  (j.avisos||[]).forEach(a => linhas.push('<b>Arquivo não importado:</b> ' + esc(a)));

 }

function filaDe(d){
 const st = d.lead_status || 'novo';
 if(d.encerradoEm || st === 'descartado') return 'encerrados';
 if(d.respondeuEm || st === 'respondeu' || st === 'fechado') return 'responderam';
 if(!d.enviadoEm) return 'enviar';
 if(d.primeira_abertura_em) return 'abriram';
 if(!d.followupEnviadoEm && d.followupEm && d.followupEm <= HOJE) return 'followup';
 return 'aguardando';
}

function passa(d){
 if(frenteAtual!=='todas' && d.frente!==frenteAtual) return false;
 if(canalAtual!=='todos' && d.canal!==canalAtual) return false;
 if(termo){
  const t = [d.lead_nome, d.lead_cidade, d.mensagem, d.lead_motivo, d.contato].join(' ').toLowerCase();
  if(!t.includes(termo)) return false;
 }
 return true;
}

function linkCanal(d, texto){
 if(d.canal==='whatsapp'){
  const bruto = String(d.contato || d.lead_whatsapp || '').trim();
  if(/^https?:\/\//i.test(bruto)) return bruto;               // wa.link / wa.me/message: sem número, abre o link
  if(/^message\//i.test(bruto)) return 'https://wa.me/' + bruto;
  let n = bruto.replace(/\D/g,'');
  if(!n) return null;
  if(!n.startsWith('55')) n = '55' + n;
  return 'https://wa.me/' + n + '?text=' + encodeURIComponent(texto);
 }
 if(d.canal==='instagram'){
  const c = String(d.contato||'');
  if(/^https?:\/\//.test(c)) return c;
  if(c.startsWith('@')) return 'https://www.instagram.com/' + c.slice(1) + '/';
  return d.lead_siteAntigo && d.lead_siteAntigo.includes('instagram.com') ? d.lead_siteAntigo : null;
 }
 if(d.canal==='email'){
  const para = d.contato || d.lead_email; if(!para) return null;
  return 'mailto:' + para + '?subject=' + encodeURIComponent(d.assunto||'') + '&body=' + encodeURIComponent(texto);
 }
 if(d.canal==='messenger') return /^https?:\/\//.test(d.contato||'') ? d.contato : null;
 return null;
}

function historico(d){
 const it = [`<li class="feito">Mensagem criada em ${br(d.criadoEm)}</li>`];
 if(d.enviadoEm) it.push(`<li class="feito">Enviada por ${CANAIS[d.canal]||d.canal} em ${d.enviado_em?hm(d.enviado_em):br(d.enviadoEm)}</li>`);
 if(d.followupEnviadoEm) it.push(`<li class="feito">Follow-up enviado em ${br(d.followupEnviadoEm)}</li>`);
 else if(d.enviadoEm && d.followupEm && !d.respondeuEm && !d.encerradoEm) it.push(`<li class="prox">Follow-up previsto para ${br(d.followupEm)}</li>`);
 if(d.apresentacaoEm) it.push(`<li class="feito">Apresentação enviada em ${br(d.apresentacaoEm)}</li>`);
 if(d.respondeuEm) it.push(`<li class="feito">Respondeu em ${d.respondeu_em?hm(d.respondeu_em):br(d.respondeuEm)}</li>`);
 if(d.encerradoEm) it.push(`<li>Encerrado em ${br(d.encerradoEm)}${d.motivo?': '+esc(d.motivo):''}</li>`);
 return `<ul class="hist">${it.join('')}</ul>`;
}

 }
 if(a==='enviado') return executar(id, a, {agora: agoraLocal()});
 if(a==='apresentacao') return executar(id, a, {texto: d.apresentacaoMsg});
 if(a==='clienteDisse'){
  const t = (document.getElementById('rc'+id)||{}).value || '';
  if(!t.trim()){ toast('Cole a resposta do cliente primeiro.', false); return; }
  return executar(id, a, {texto: t});
 }
 if(a==='respostaEnviada'){
  if(!(d.respostaMsg||'').trim()){ toast('Escreva a sua resposta primeiro.', false); return; }
  return executar(id, a, {texto: d.respostaMsg});
 }
 if(a==='sugestao'){
  const p = pedidoClaude(d);
  (navigator.clipboard ? navigator.clipboard.writeText(p) : Promise.reject()).then(
   ()=>toast('Pedido copiado. Cole num chat do Claude e traga a resposta para "Sua resposta".', false),
   ()=>toast('Não deu para copiar neste navegador.', false));
  return;
 }
 executar(id, a);
});

document.addEventListener('input', e=>{
 const t = e.target;
 if(t.dataset && t.dataset.campo && t.dataset.id){
  clearTimeout(timers[t.dataset.id+t.dataset.campo]);
  timers[t.dataset.id+t.dataset.campo] = setTimeout(()=>salvarCampo(t), 700);
 }
 if(t.id==='busca'){ termo = t.value.trim().toLowerCase(); renderFilas(); renderLista(); }
});

document.getElementById('toastUndo').addEventListener('click', async ()=>{
 if(!ultimo) return;
 const u = ultimo; ultimo = null;
 try{
  await api(`/api/disparos/${u.id}/restaurar`, {method:'POST', body:JSON.stringify({antes:u.antes})});
  await carregar(false); toast('Desfeito.', false);
 }catch(e){ toast('Não deu para desfazer: ' + e.message, false); }
});
document.getElementById('atualizar').addEventListener('click', ()=>carregar(true));

let vistaAtual = 'cards', METRICA_CALOR = 'resposta';

/* Atualização automática: a cada minuto, com a página visível, busca as aberturas na VPS.
   Só redesenha se alguém abriu, e espera você sair do campo de texto para não atrapalhar a digitação. */
const NOVOS = new Set();
let pendente = false;
function editando(){ const a = document.activeElement; return a && (a.tagName==='TEXTAREA' || (a.tagName==='INPUT' && a.id!=='busca')); }
async function verAberturas(){
 if(document.hidden) return;
 let r; try{ r = await api('/api/rastreio/sincronizar', {method:'POST', body:'{}'}); }catch(e){ return; }
 if(!r.ok || !r.novos) return;
 let j; try{ j = await api('/api/disparos'); }catch(e){ return; }
 const antes = Object.fromEntries(itens.map(d=>[d.id, d.total_aberturas||0]));
 const abriram = (j.disparos||[]).filter(d => (d.total_aberturas||0) > (antes[d.id]||0));
 if(!abriram.length) return;
 const editados = Object.fromEntries(itens.map(d=>[d.id, d]));
 itens = j.disparos.map(d => { const v = editados[d.id]; if(v && v.apresentacaoMsg && !d.apresentacaoMsg) d.apresentacaoMsg = v.apresentacaoMsg; else if(!d.apresentacaoMsg) d.apresentacaoMsg = apresPadrao(d); return d; });
 abriram.forEach(d => NOVOS.add(d.id));
 const nomes = abriram.map(d => d.lead_nome || d.slug);
 const txt = nomes.length===1 ? nomes[0] + ' abriu o link agora.' : nomes[0] + ' e mais ' + (nomes.length-1) + ' abriram o link agora.';
 toast(txt + ' Veja na fila "Abriram".', false);
 document.title = '(' + NOVOS.size + ') Prospector — Disparos';
 if(editando()) pendente = true; else render();
 if(vistaAtual==='metricas') carregarMetricas();
}
setInterval(verAberturas, 60000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) verAberturas(); });
document.addEventListener('focusout', ()=>{ setTimeout(()=>{ if(pendente && !editando()){ pendente = false; render(); } }, 300); });
document.addEventListener('click', e=>{ if(e.target.closest('[data-fila="abriram"]')) document.title = 'Prospector — Disparos'; });
function trocarVista(v){
 vistaAtual = v;
 document.querySelectorAll('[data-vista]').forEach(b=>{ b.classList.toggle('on', b.dataset.vista===v); b.setAttribute('aria-selected', b.dataset.vista===v); });
 document.getElementById('vCards').hidden = v!=='cards';
 document.getElementById('vMetricas').hidden = v!=='metricas';
 if(v==='metricas') carregarMetricas();
}
function irPara(id){
 const d = itens.find(x=>x.id===id); if(!d) return;
 filaAtual = filaDe(d); frenteAtual='todas'; canalAtual='todos'; termo = (d.lead_nome||'').toLowerCase();
 document.getElementById('busca').value = d.lead_nome||''; trocarVista('cards'); render();
}
const pct = v => v==null ? '—' : String(v).replace('.',',')+'%';
const DIAS = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const tom = a => `color-mix(in srgb, var(--accent) ${Math.round(a*100)}%, var(--paper))`;
async function carregarMetricas(){
 const el = document.getElementById('vMetricas');
 let m; try{ m = await api('/api/rastreio/metricas'); }catch(e){ el.innerHTML = `<div class="vazio"><b>Não deu para calcular</b>${esc(e.message)}</div>`; return; }
 const cs = Object.entries(m.canais).sort((a,b)=>b[1].enviados-a[1].enviados);
 const soma = k => cs.reduce((a,[,v])=>a+(v[k]||0),0);
 const rast = soma('rastreados'), ab = soma('abertos'), env = soma('enviados'), resp = soma('responderam');
 const tiles = [
  [pct(rast?Math.round(1000*ab/rast)/10:null), 'Taxa de abertura', `${ab} de ${rast} envios rastreados`],
  [pct(env?Math.round(1000*resp/env)/10:null), 'Taxa de resposta', `${resp} de ${env} envios`],
  [dur(m.geral_mediana_min_abertura), 'Tempo típico até abrir', 'mediana, só pessoas'],
  [String(m.sem_abertura.length), 'Sem abertura há +72h', 'fila de follow-up abaixo']
 ];
 const linhas = cs.map(([k,v])=>`<tr><td>${esc(CANAIS[k]||k)}</td><td>${v.enviados}</td><td>${v.rastreados}</td><td>${v.abertos}</td><td>${pct(v.taxa_abertura)}</td><td>${v.responderam}</td><td>${pct(v.taxa_resposta)}</td><td>${dur(v.mediana_min_abertura)}</td><td>${dur(v.media_min_abertura)}</td><td>${dur(v.mediana_min_resposta)}</td><td>${dur(v.media_min_resposta)}</td></tr>`).join('');
 let maxEnv = 0; Object.values(m.calor).forEach(c=>maxEnv=Math.max(maxEnv,c.enviados));
 const horas = [...Array(24).keys()];
 let grade = '<div></div>' + horas.map(h=>`<div class="h">${h}</div>`).join('');
 DIAS.forEach((dn,di)=>{
  grade += `<div class="dl">${dn}</div>`;
  horas.forEach(h=>{
   const c = m.calor[di+'-'+h];
   if(!c){ grade += `<div class="c" data-dica="${dn} ${h}h: nenhum envio"></div>`; return; }
   const taxa = METRICA_CALOR==='envios' ? c.enviados/maxEnv : (METRICA_CALOR==='abertura' ? c.abertos : c.responderam)/c.enviados;
   const rot = METRICA_CALOR==='envios' ? c.enviados : Math.round(100*taxa);
   grade += `<div class="c ${taxa>=.5?'v':''}" style="background:${tom(.15+.85*taxa)}" data-dica="${dn} ${h}h · ${c.enviados} envio${c.enviados>1?'s':''} · ${c.abertos} abert${c.abertos==1?'o':'os'} · ${c.responderam} resposta${c.responderam==1?'':'s'}">${rot}</div>`;
  });
 });
 const fila = m.sem_abertura.map(f=>`<div class="item"><b>${esc(f.nome)}</b><span>${esc(CANAIS[f.canal]||f.canal)} · enviado ${hm(f.enviado_em)} · há ${Math.floor(f.horas/24)} dias${f.followupEnviadoEm?' · follow-up já feito em '+br(f.followupEnviadoEm):''}</span><button class="btn" data-ir="${f.id}">Abrir card</button></div>`).join('');
 el.innerHTML = `
  <div class="tiles">${tiles.map(t=>`<div class="tile"><div class="n">${t[0]}</div><div class="l">${t[1]}</div><div class="d">${t[2]}</div></div>`).join('')}</div>
  <h2>Por canal</h2>
  <p class="sub">Abertura conta só envios com link rastreável e “Enviei” marcado, e só acessos de pessoas (robôs de pré-visualização e acessos até 15 s depois do envio ficam de fora). Resposta conta todos os envios.${m.ultima_sync?' Última leitura da VPS: '+hm(m.ultima_sync)+'.':' A VPS ainda não foi lida.'} Acessos registrados: ${m.acessos.total} (${m.acessos.bots} de robô).</p>
  <div class="rolar"><table class="tab"><thead><tr><th>Canal</th><th>Enviados</th><th>Rastreados</th><th>Abriram</th><th>Abertura</th><th>Responderam</th><th>Resposta</th><th>Até abrir (mediana)</th><th>Até abrir (média)</th><th>Até responder (mediana)</th><th>Até responder (média)</th></tr></thead><tbody>${linhas||'<tr><td colspan="11">Nenhum envio ainda.</td></tr>'}</tbody></table></div>
  <h2>Hora e dia do envio</h2>
  <p class="sub">Cada quadrado é um horário de envio (só envios rastreados, pela hora do “Enviei”). Passe o mouse para ver os números: com poucos envios num quadrado, 100% pode ser 1 de 1.</p>
  <div class="grupo" style="margin-bottom:10px"><span>Mostrar</span>${[['resposta','% de resposta'],['abertura','% de abertura'],['envios','nº de envios']].map(([k,n])=>`<button class="chip ${METRICA_CALOR===k?'on':''}" data-calor="${k}">${n}</button>`).join('')}</div>
  <div class="rolar"><div class="calor">${grade}</div></div>
  <div class="leg"><span>menos</span>${[.15,.43,.72,1].map(a=>`<i style="background:${tom(a)}"></i>`).join('')}<span>mais</span><span>· vazio = nenhum envio nesse horário</span></div>
  <h2>Fila de follow-up: sem abertura há mais de 72 h</h2>
  <p class="sub">Enviados com link rastreável que ninguém abriu, sem resposta e não encerrados.</p>
  <div class="fup">${fila || '<div class="vazio"><b>Ninguém nessa fila</b>Todo envio rastreado com mais de 72 h já foi aberto ou respondido.</div>'}</div>`;
}
const dica = document.getElementById('dica');
document.addEventListener('mousemove', e=>{
 const c = e.target.closest && e.target.closest('[data-dica]');
 if(!c){ dica.style.display='none'; return; }
 dica.textContent = c.dataset.dica; dica.style.display='block';
 dica.style.left = Math.min(e.clientX+12, innerWidth-250)+'px'; dica.style.top = (e.clientY+14)+'px';
});

carregar(true);
</script>
</body>
</html>
